name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint, build, and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      test-outcome: ${{ steps.jest.outcome }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run Jest and capture output
        id: jest
        shell: bash
        run: set -o pipefail; npm test 2>&1 | tee test-results.log

      - name: Upload Jest output
        if: always() && steps.jest.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: jest-failure-${{ github.run_id }}
          path: test-results.log
          retention-days: 7

  auto-fix:
    name: Auto-heal failed Jest tests
    needs: test
    if: >-
      ${{ failure() &&
          needs.test.outputs.test-outcome == 'failure' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      copilot-requests: write
      pull-requests: write

    steps:
      - name: Check out failing revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download Jest failure output
        uses: actions/download-artifact@v8
        with:
          name: jest-failure-${{ github.run_id }}

      - name: Prepare guarded Copilot prompt
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}
        run: npm run auto-heal -- prepare test-results.log auto-heal-prompt.txt

      - name: Install GitHub Copilot CLI
        run: npm install --global @github/copilot

      - name: Ask Copilot to generate a patch
        id: inference
        uses: actions/ai-inference@v3
        with:
          prompt-file: auto-heal-prompt.txt
          model: ${{ vars.COPILOT_MODEL || 'gpt-4.1' }}
          system-prompt: >-
            You are a cautious TypeScript repair agent. Return only the requested
            unified git diff and never modify tests or configuration.
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Validate and apply Copilot patch
        run: npm run auto-heal -- apply "${{ steps.inference.outputs.response-file }}"

      - name: Verify AI patch
        run: |
          npm run lint
          npm run typecheck
          npm run build
          npm test

      - name: Commit patch and open pull request
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PATCH_BRANCH: fix/auto-heal-${{ github.run_id }}
          BASE_BRANCH: ${{ github.event.pull_request.head.ref || 'main' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$PATCH_BRANCH"
          git add src
          git commit -m "Fix failing tests with auto-healing agent"
          git push origin "$PATCH_BRANCH"
          gh pr create \
            --base "$BASE_BRANCH" \
            --head "$PATCH_BRANCH" \
            --title "Auto-heal failing Jest tests (${{ github.run_id }})" \
            --body-file .github/auto-heal-pr.md
